<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopify → Zoho Converter Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: linear-gradient(135deg, #e8f0fe 0%, #f0f4ff 50%, #e0e7ff 100%);
    min-height: 100vh;
    padding: 1.5rem 1rem 2rem;
  }

  /* Hub Header */
  .hub-header {
    max-width: 960px;
    margin: 0 auto 1.5rem;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .hub-logo {
    width: 46px; height: 46px;
    background: linear-gradient(135deg, #1a56db, #3b82f6);
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 14px rgba(26,86,219,0.35);
    flex-shrink: 0;
  }
  .hub-logo svg { width: 24px; height: 24px; fill: #fff; }
  .hub-title { font-size: 20px; font-weight: 800; color: #111827; line-height: 1.2; }
  .hub-sub   { font-size: 12.5px; color: #6b7280; margin-top: 2px; }
  .hub-badge {
    margin-left: auto;
    background: #dbeafe; color: #1a56db;
    font-size: 11px; font-weight: 700;
    padding: 4px 12px; border-radius: 20px;
    white-space: nowrap;
  }

  /* Tab Bar */
  .tab-bar {
    max-width: 960px;
    margin: 0 auto 0;
    display: flex;
    gap: 6px;
    background: rgba(255,255,255,0.65);
    backdrop-filter: blur(8px);
    border-radius: 16px 16px 0 0;
    padding: 10px 10px 0;
    border: 1px solid rgba(255,255,255,0.85);
    border-bottom: none;
    overflow-x: auto;
  }
  .tab-bar::-webkit-scrollbar { height: 0; }

  .tab-btn {
    display: flex; align-items: center; gap: 7px;
    padding: 9px 20px;
    border: none; border-radius: 10px 10px 0 0;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 13px; font-weight: 600;
    cursor: pointer;
    background: transparent; color: #6b7280;
    transition: all 0.18s ease;
    white-space: nowrap;
    position: relative; bottom: -1px;
  }
  .tab-btn:hover { background: rgba(26,86,219,0.08); color: #1a56db; }
  .tab-btn.active {
    background: #fff; color: #1a56db;
    box-shadow: 0 -2px 12px rgba(26,86,219,0.10);
    border: 1px solid #e5e7eb;
    border-bottom: 2px solid #fff;
  }
  .tab-dot { width: 8px; height: 8px; border-radius: 50%; background: #d1d5db; flex-shrink: 0; transition: background 0.18s; }
  .tab-btn.active .tab-dot { background: #1a56db; }

  /* Tab Panels */
  .tab-panels {
    max-width: 960px;
    margin: 0 auto;
    background: #f9fafb;
    border-radius: 0 0 20px 20px;
    border: 1px solid #e5e7eb;
    border-top: none;
    box-shadow: 0 12px 40px rgba(0,0,0,0.08);
    overflow: hidden;
  }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; animation: fadeIn 0.2s ease; }

  .tab-panel iframe {
    width: 100%;
    height: 82vh;
    border: none;
    display: block;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(5px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div class="hub-header">
  <div class="hub-logo">
    <svg viewBox="0 0 24 24"><path d="M19 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm-7 14l-5-5 1.41-1.41L12 14.17l7.59-7.59L21 8l-9 9z"/></svg>
  </div>
  <div>
    <div class="hub-title">E-Commerces Invoice reports → Zoho Converter Hub</div>
    <div class="hub-sub">Switch between converter instances using tabs below</div>
  </div>
  <div class="hub-badge">Satanand</div>
</div>

<div class="tab-bar">
  <button class="tab-btn active" onclick="switchTab(0)"><span class="tab-dot"></span> Meesho</button>
  <button class="tab-btn"        onclick="switchTab(1)"><span class="tab-dot"></span>Shopify</button>
  <!-- <button class="tab-btn"        onclick="switchTab(2)"><span class="tab-dot"></span> Converter 3</button>
  <button class="tab-btn"        onclick="switchTab(3)"><span class="tab-dot"></span> Converter 4</button> -->
</div>

<div class="tab-panels">
  <div class="tab-panel active" id="panel-0">
    <iframe src="meesho to zoho.html"></iframe>
  </div>
  <div class="tab-panel" id="panel-1">
    <iframe src="shopify_to_zoho.html"></iframe>
  </div>
  <!-- <div class="tab-panel" id="panel-2">
    <iframe src="shopify_to_zoho_converter_-_Copy__2_.html"></iframe>
  </div>
  <div class="tab-panel" id="panel-3">
    <iframe src="shopify_to_zoho_converter_-_Copy__3_.html"></iframe>
  </div> -->
</div>

<script>
  const tabs   = document.querySelectorAll('.tab-btn');
  const panels = document.querySelectorAll('.tab-panel');

  function switchTab(idx) {
    tabs.forEach((t, i)   => t.classList.toggle('active', i === idx));
    panels.forEach((p, i) => p.classList.toggle('active', i === idx));
  }
</script>

</body>
</html>
